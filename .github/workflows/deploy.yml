# .github/workflows/deploy.yml
#
# This is your CI/CD pipeline. GitHub reads this file automatically.
# Every push to "main" triggers this entire workflow.

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]      # trigger on every push to main
  pull_request:
    branches: [ main ]      # also run tests on pull requests

jobs:

  # ── Job 1: Run Tests ────────────────────────────────────────────────────────
  # This runs first. If any test fails, the whole pipeline stops.
  # We never build or deploy broken code.
  test:
    name: Run Tests
    runs-on: ubuntu-latest   # GitHub gives us a fresh Ubuntu machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # "checkout" means: download our repo code onto this machine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
        # If this fails, GitHub marks the pipeline ❌ and stops here

  # ── Job 2: Build & Push Docker Image ───────────────────────────────────────
  # Only runs if Job 1 (tests) passed.
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test              # ← "only run me if 'test' job succeeded"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}   # from GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}   # never visible in logs

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # We tag with the git commit SHA — every build gets a unique tag
          # so we can always trace exactly which code is running in production
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-app:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }}

  # ── Job 3: Deploy to Kubernetes ─────────────────────────────────────────────
  # Only runs if Job 2 (build) passed.
  # Updates the running deployment to use the new image.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build             # ← "only run me if 'build' job succeeded"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        # This connects kubectl to your cluster using a saved config
        # You'll add KUBE_CONFIG as a secret in the next step
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy new image
        run: |
          kubectl set image deployment/todo-deployment \
            todo-app=${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/todo-deployment --timeout=60s