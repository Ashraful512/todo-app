# ── Job 3: Deploy to Kubernetes ─────────────────────────────────────────────
  # NOTE: minikube runs locally on your laptop, not on a public server.
  # In a real job you would deploy to AWS EKS or Google GKE from here.
  # For now: after this pipeline passes, you deploy manually with one command.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deployment instructions
        run: |
          echo "✅ Tests passed!"
          echo "✅ Image pushed to Docker Hub: ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }}"
          echo ""
          echo "To deploy locally, run:"
          echo "kubectl set image deployment/todo-deployment todo-app=${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }}"
          echo ""
          echo "In production you would deploy to AWS EKS or Google GKE from here."